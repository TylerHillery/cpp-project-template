repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: format-check
        name: Check C++ formatting
        entry: make format-check
        language: system
        pass_filenames: false
      - id: test
        name: Build and run C++ tests
        entry: make test
        language: system
        pass_filenames: false
